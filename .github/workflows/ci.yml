# [ACT-01] [ACT-02] self-test of the composite action
# Action versions checked on 2026-10-08 (research notes of the design spec): actions/checkout v7.0.1,
# actions/setup-node v7.1.0, github/codeql-action/upload-sarif v4.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (no network)
        run: npm test
        timeout-minutes: 10
        env:
          PROPERTY_SEED: "20261008"
      - run: npm run check:secrets
      - run: npm run catalog:validate
      - run: npm run catalog:freshness
      # setup-node restores ~/.npm (with the npx install of mermaid-cli) but not ~/.cache/puppeteer, where the postinstall of puppeteer
      # puts the browser, so a cache hit would reuse mermaid-cli without a browser. Dropping the npx installs makes npx reinstall both.
      - run: rm -rf ~/.npm/_npx
      - run: npm run diagrams:check
      - run: npm run eval:fake

  self-action:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run the action on the demo fixture (findings do not fail the step)
        id: a
        uses: ./
        with:
          path: fixtures/telehealth-clinic
          fail-on: none
      - name: Run the action again with fail-on error (exit code 1 is the expected result)
        id: b
        uses: ./
        continue-on-error: true
        with:
          path: fixtures/telehealth-clinic
          fail-on: error
      - name: Assert the exit codes and the SARIF outputs
        env:
          A_SARIF: ${{ steps.a.outputs.sarif-file }}
          B_SARIF: ${{ steps.b.outputs.sarif-file }}
          B_CODE: ${{ steps.b.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$B_CODE" = "1"
          test -n "$A_SARIF"
          test -n "$B_SARIF"
          node src/cli.ts catalog --validate-sarif "$A_SARIF"
          node src/cli.ts catalog --validate-sarif "$B_SARIF"
      - name: Upload SARIF to code scanning (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.a.outputs.sarif-file }}
          category: fixture
