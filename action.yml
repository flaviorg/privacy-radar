name: privacy-radar
description: Personal-data scanner for LGPD and GDPR (drafts, not legal advice)
inputs:
  path:           { description: Directory to scan, default: "." }
  regime:         { description: lgpd, gdpr or both, default: both }
  fail-on:        { description: error, warning, note or none, default: error }
  min-confidence: { description: 0 to 1, default: "0.5" }
  base:           { description: Base ref for PR mode (empty = full scan), default: "" }
outputs:
  sarif-file:   { description: Path of findings.sarif, value: "${{ steps.run.outputs.sarif }}" }
  comment-file: { description: Path of pr-comment.md (PR mode only; empty otherwise), value: "${{ steps.run.outputs.comment }}" }
  exit-code:    { description: Exit code of the CLI (0 clean, 1 findings at or above fail-on), value: "${{ steps.run.outputs.code }}" }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with: { node-version-file: "${{ github.action_path }}/.nvmrc" }
    - run: npm ci --omit=dev --prefix "$GITHUB_ACTION_PATH"
      shell: bash
    - id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_REGIME: ${{ inputs.regime }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/privacy-radar"
        rm -rf "$out"  # RUNNER_TEMP is shared by every step of the job: never report a previous step's files
        code=0
        if [ -n "$INPUT_BASE" ]; then
          node "$GITHUB_ACTION_PATH/src/cli.ts" pr --base "$INPUT_BASE" --repo "$INPUT_PATH" --regime "$INPUT_REGIME" --format md,json,sarif --out "$out" --fail-on "$INPUT_FAIL_ON" || code=$?
        else
          node "$GITHUB_ACTION_PATH/src/cli.ts" scan "$INPUT_PATH" --regime "$INPUT_REGIME" --format json,sarif,table --out "$out" --fail-on "$INPUT_FAIL_ON" --min-confidence "$INPUT_MIN_CONFIDENCE" --llm none || code=$?
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$out/findings.sarif" ]; then echo "sarif=$out/findings.sarif" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$out/pr-comment.md" ]; then
          echo "comment=$out/pr-comment.md" >> "$GITHUB_OUTPUT"
          cat "$out/pr-comment.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$code"
